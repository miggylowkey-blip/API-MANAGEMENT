apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: api-managementz
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
      appProtocol: tcp
  type: ClusterIP
  sessionAffinity: None
  internalTrafficPolicy: Local
  publishNotReadyAddresses: false
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
