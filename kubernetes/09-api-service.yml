apiVersion: v1
kind: Service
metadata:
  name: api-managementz
  namespace: api-managementz
spec:
  type: LoadBalancer
  selector:
    app: api-managementz
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
      appProtocol: http
  sessionAffinity: None
  internalTrafficPolicy: Local
  externalTrafficPolicy: Local
  publishNotReadyAddresses: false
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
