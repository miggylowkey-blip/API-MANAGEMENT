apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: api-managementz
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
      appProtocol: tcp
  type: ClusterIP
  sessionAffinity: None
  internalTrafficPolicy: Local
  publishNotReadyAddresses: false
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
