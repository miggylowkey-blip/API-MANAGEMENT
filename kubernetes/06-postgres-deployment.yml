apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: api-managementz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      automountServiceAccountToken: false
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ -d /var/lib/postgresql/data ] && [ ! -z "$(ls -A /var/lib/postgresql/data)" ]; then
                echo "Data directory has contents, checking if it's valid..."
                if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
                  echo "Invalid data directory, removing..."
                  rm -rf /var/lib/postgresql/data/*
                fi
              fi
              mkdir -p /var/lib/postgresql/data
              chmod 700 /var/lib/postgresql/data
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: api_managementz
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: api-managementz-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-managementz-secret
                  key: DB_PASSWORD
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: initdb-scripts
              mountPath: /docker-entrypoint-initdb.d
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: initdb-scripts
          configMap:
            name: postgres-initdb
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
