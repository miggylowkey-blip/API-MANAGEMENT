apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: api-managementz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: api_managementz
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: api-managementz-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-managementz-secrets
                  key: DB_PASSWORD
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - api_managementz
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: initdb-scripts
              mountPath: /docker-entrypoint-initdb.d
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: initdb-scripts
          configMap:
            name: postgres-initdb
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
