apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-managementz
  namespace: api-managementz
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-managementz
  template:
    metadata:
      labels:
        app: api-managementz
    spec:
      containers:
        - name: api-managementz
          image: api-managementz:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-managementz-config
            - secretRef:
                name: api-managementz-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: "512Mi"
            limits:
              cpu: "3"
              memory: "1Gi"
