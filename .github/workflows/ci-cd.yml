name: CI / CD Pipeline with Kubernetes Deployment

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/api-managementz

jobs:
  # Stage 1: Code Quality and Security Scanning
  ci:
    name: Lint, Test, Build, and Scan Code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l -e .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Gitleaks - Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy - Filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: json
          output: trivy-results.json

      - name: Upload Trivy JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-filesystem-report
          path: trivy-results.json

 
  build:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      image-tag: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          load: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy vulnerability scan on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: json
          output: trivy-image-results.json
          severity: CRITICAL,HIGH

      - name: Upload Trivy image JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-report
          path: trivy-image-results.json

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  # Stage 3: Validate Kubernetes Manifests
  k8s-validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - name: Install Kubeval
        run: |
          wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin

      - name: Validate Kubernetes manifests
        run: |
          for file in kubernetes/*.yml; do
            echo "Validating $file"
            kubeval "$file" --strict --ignore-missing-schemas
          done

      - name: Install kubesec
        run: |
          wget https://github.com/controlplaneio/kubesec/releases/latest/download/kubesec_linux_amd64.tar.gz
          tar xf kubesec_linux_amd64.tar.gz
          sudo mv kubesec /usr/local/bin

      - name: Security scan Kubernetes workloads with kubesec
        run: |
          for file in kubernetes/*deployment.yml; do
            [ -e "$file" ] || continue
            echo "Security scanning $file"
            kubesec scan "$file" | jq '.[] | select(.score < 5)' | grep -q . && echo "⚠️  $file has low security score" && exit 1 || true
          done
          echo "Note: Service manifests are verified by kubeval; kubesec currently focuses on workload resources."

  # Stage 4: Deploy to Kubernetes
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build, k8s-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Create namespace
        run: kubectl create namespace api-managementz --dry-run=client -o yaml | kubectl apply -f -

      - name: Update image in deployment
        run: |
          kubectl set image deployment/api-managementz \
            api-managementz=${{ needs.build.outputs.image-tag }} \
            -n api-managementz \
            --record=true || true

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f kubernetes/ -n api-managementz

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api-managementz \
            -n api-managementz \
            --timeout=5m

      - name: Wait for readiness
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=api-managementz \
            -n api-managementz \
            --timeout=3m

      - name: Health check
        run: |
          POD_NAME=$(kubectl get pods -n api-managementz -l app=api-managementz -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward pod/$POD_NAME 8080:8080 -n api-managementz &
          sleep 2
          curl -f http://localhost:8080/health || (echo "Health check failed"; exit 1)

      - name: Verify all replicas
        run: |
          kubectl get deployment api-managementz -n api-managementz
          DESIRED=$(kubectl get deployment api-managementz -n api-managementz -o jsonpath='{.spec.replicas}')
          READY=$(kubectl get deployment api-managementz -n api-managementz -o jsonpath='{.status.readyReplicas}')
          if [ "$DESIRED" != "$READY" ]; then echo "Not all replicas ready"; exit 1; fi

      - name: Log deployment status
        if: always()
        run: |
          echo "=== Deployment Status ==="
          kubectl get all -n api-managementz
          echo "=== Pod Logs ==="
          kubectl logs -n api-managementz -l app=api-managementz --tail=50

  # Stage 5: Post-deployment verification
  verify:
    name: Post-deployment Verification
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4

      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Smoke tests
        run: |
          kubectl run smoke-test --image=curlimages/curl:latest --rm -i --restart=Never \
            -- curl -f http://api-managementz.api-managementz.svc.cluster.local/health

      - name: Database connectivity check
        run: |
          kubectl exec -n api-managementz \
            $(kubectl get pods -n api-managementz -l app=postgres -o jsonpath='{.items[0].metadata.name}') \
            -- pg_isready -U api_managementz -d api_managementz

      - name: Redis connectivity check
        run: |
          kubectl exec -n api-managementz \
            $(kubectl get pods -n api-managementz -l app=redis -o jsonpath='{.items[0].metadata.name}') \
            -- redis-cli ping

      - name: Create deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Namespace:** api-managementz" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Resources" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get all -n api-managementz >> $GITHUB_STEP_SUMMARY 2>&1
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY